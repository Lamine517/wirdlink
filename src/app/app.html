<a class="skip-link" href="#main">Aller au contenu</a>
<div class="app-shell">
  <div class="demo-banner">Démonstration · vos parts restent sur cet appareil</div>
  <main #content class="app-shell__content" id="main" tabindex="-1">
    @if (store.storageWarning()) {
      <p class="feedback" role="status">{{ store.storageWarning() }}</p>
    }
    <router-outlet (activate)="resetScroll()" />
  </main>
  <nav class="bottom-nav" aria-label="Navigation principale">
    <a
      routerLink="/"
      class="bottom-nav__link"
      routerLinkActive="bottom-nav__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
    >
      <img src="assets/icons/home.svg" alt="" width="28" height="28" />Accueil
    </a>
    <a
      routerLink="/mes-parts"
      class="bottom-nav__link"
      routerLinkActive="bottom-nav__link--active"
      ariaCurrentWhenActive="page"
    >
      <img src="assets/icons/hand.svg" alt="" width="28" height="28" />Mes parts
    </a>
    <a
      routerLink="/creer"
      class="bottom-nav__link"
      routerLinkActive="bottom-nav__link--active"
      ariaCurrentWhenActive="page"
    >
      <img src="assets/icons/plus.svg" alt="" width="28" height="28" />Créer
    </a>
  </nav>
</div>
