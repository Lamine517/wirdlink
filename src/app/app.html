<a class="skip-link" href="#main">Aller au contenu</a>
<div class="desktop-layout" [class.desktop-layout--entered]="homeEntered()">
  <aside class="desktop-layout__intro"><app-desktop-intro [url]="shareUrl()" /></aside>
  <div class="app-shell">
    <main #content class="app-shell__content" id="main" tabindex="-1">
      @if (!network.online()) {
        <p class="feedback offline-status" role="status">
          <app-icon name="offline" [size]="24" />Hors ligne · vos parts restent consultables.
        </p>
      }
      @if (store.storageWarning()) {
        <p class="feedback" role="status">{{ store.storageWarning() }}</p>
      }
      <div #pageView class="app-page-view"><router-outlet (activate)="resetScroll()" /></div>
    </main>
    <nav class="bottom-nav" aria-label="Navigation principale">
      <a
        routerLink="/"
        class="bottom-nav__link"
        [class.bottom-nav__link--active]="section() === 'home'"
        [attr.aria-current]="section() === 'home' ? 'page' : null"
      >
        <span class="bottom-nav__icon"><app-icon name="home" [size]="28" /></span>Accueil
      </a>
      <a
        routerLink="/mes-parts"
        class="bottom-nav__link"
        [class.bottom-nav__link--active]="section() === 'parts'"
        [attr.aria-current]="section() === 'parts' ? 'page' : null"
      >
        <span class="bottom-nav__icon"><app-icon name="hand" [size]="28" /></span>Mes parts
      </a>
      <a
        routerLink="/creer"
        class="bottom-nav__link"
        [class.bottom-nav__link--active]="section() === 'create'"
        [attr.aria-current]="section() === 'create' ? 'page' : null"
      >
        <span class="bottom-nav__icon"><app-icon name="plus" [size]="28" /></span>Créer
      </a>
    </nav>
  </div>

  <aside class="desktop-layout__share">
    <app-desktop-share [url]="shareUrl()" [isWird]="sharePath() !== '/'" />
  </aside>
</div>
<footer class="desktop-footer">
  <a routerLink="/aide">Aide</a><a routerLink="/confidentialite">Vos informations</a
  ><a routerLink="/conditions">Règles d’utilisation</a><span>© 2026 WirdLink</span>
</footer>
