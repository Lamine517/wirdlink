<a class="back-link" [routerLink]="backLink()"
  ><app-icon name="back" [size]="24" />{{ 'Retour' | t }}</a
>
<div class="creation-steps">
  <span>{{ 'Étape {step} sur 3' | t: { step: step() } }}</span>
  <div
    class="creation-steps__track"
    role="progressbar"
    [attr.aria-label]="'Création du wird' | t"
    aria-valuemin="0"
    aria-valuemax="3"
    [attr.aria-valuenow]="step()"
  >
    <span [style.width.%]="(step() / 3) * 100"></span>
  </div>
</div>
