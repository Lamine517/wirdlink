<app-back-button fallback="/profil" />
<h1>Administration</h1>

<nav class="admin-menu" aria-label="Rubriques">
  @for (section of sections; track section.id) {
    <a class="admin-menu__tile" [routerLink]="section.id">
      <span class="admin-menu__icon"><app-icon [name]="section.icon" [size]="28" /></span>
      {{ section.label }}
    </a>
  }
</nav>
