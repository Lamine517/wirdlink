<div class="quantity-counter">
  <button
    type="button"
    class="quantity-counter__button"
    [attr.aria-label]="'Diminuer la quantité' | t"
    (click)="adjust(-1)"
  >
    <app-icon name="minus" [size]="24" />
  </button>
  <input
    class="quantity-counter__input"
    id="quantity"
    type="number"
    inputmode="numeric"
    [placeholder]="'Ex. 10' | t"
    (blur)="hasInteracted.set(true)"
    min="1"
    [max]="maximum()"
    step="1"
    [formControl]="control()"
    [class.quantity-counter__input--invalid]="!!validationMessage()"
    [attr.aria-invalid]="!!validationMessage()"
    [attr.aria-describedby]="validationMessage() ? 'quantity-error quantity-hint' : 'quantity-hint'"
    required
  />
  <button
    type="button"
    class="quantity-counter__button"
    [attr.aria-label]="'Augmenter la quantité' | t"
    (click)="adjust(1)"
  >
    <app-icon name="plus" [size]="28" />
  </button>
</div>
@if (validationMessage()) {
  <p class="quantity-error" id="quantity-error" role="alert">
    <app-icon name="warning" [size]="24" />{{ validationMessage() | t }}
  </p>
}
<p id="quantity-hint">{{ 'lectures' | t }}</p>
<div class="choice-list">
  @for (amount of suggestions(); track $index) {
    <button
      type="button"
      class="button button--outline button--compact"
      [class.button--selected]="currentValue() === amount"
      [attr.aria-pressed]="currentValue() === amount"
      (click)="setQuantity(amount)"
    >
      {{ amount }}
    </button>
  }
  <button
    type="button"
    class="button button--outline button--compact"
    value="all"
    [disabled]="maximum() < 1"
    [attr.aria-label]="'Prendre les {count} lectures disponibles' | t: { count: maximum() }"
    (click)="setQuantity(maximum())"
  >
    {{ 'Tout' | t }}
  </button>
</div>
