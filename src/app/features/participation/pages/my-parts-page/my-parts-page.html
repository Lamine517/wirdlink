@if (message()) {
  <p class="feedback feedback--error" role="alert">{{ message() }}</p>
}
<h1>Mes parts</h1>
@if (groups().length) {
  <label class="parts-search" for="parts-search"
    ><app-icon name="search" [size]="20" /><span class="visually-hidden">Rechercher mes parts</span
    ><input id="parts-search" type="search" [formControl]="search" placeholder="Un wird, un nom…"
  /></label>
  <p class="parts-count" aria-live="polite">
    {{ visibleGroups().length }} {{ visibleGroups().length > 1 ? 'wirds' : 'wird' }}
  </p>
}
@for (group of visibleGroups(); track group.wirdId) {
  <app-part-card
    [group]="group"
    [progress]="counter.progress()"
    [disabled]="!network.online()"
    (finishRequested)="finish($event)"
  />
} @empty {
  @if (groups().length) {
    <app-empty-state
      title="Aucun résultat"
      description="Essayez un autre nom ou un autre wird."
      actionLabel="Effacer la recherche"
      (actionRequested)="search.setValue('')"
    />
  } @else {
    <app-empty-state
      title="Vous n’avez pas encore participé"
      description="Choisissez un wird et touchez « Je participe »."
      actionLabel="Voir les wirds"
      actionLink="/"
    />
  }
}

<a class="device-options-link" routerLink="/preferences">Rappels et écran d’accueil</a>
