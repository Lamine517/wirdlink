<app-back-button fallback="/creer/apercu" />
@if (callbackMode) {
  <h1>Votre connexion</h1>
  <app-request-state
    [loading]="busy()"
    loadingLabel="Connexion en cours…"
    [error]="error()"
    retryLabel="Recommencer"
    (retry)="retryCallback()"
  />
} @else {
  <h1>Votre connexion</h1>
  <p class="auth-hint">Connectez-vous pour publier votre wird.</p>
  <button
    class="button button--outline auth-google"
    type="button"
    [disabled]="busy() || !network.online()"
    (click)="oauth('google')"
  >
    <img src="assets/icons/providers/google.svg" width="20" height="20" alt="" />
    Continuer avec Google
  </button>
  <div class="segmented-choice auth-methods" role="tablist" aria-label="Autres moyens de connexion">
    <button
      type="button"
      role="tab"
      id="auth-phone-tab"
      aria-controls="auth-coming-soon"
      [attr.aria-selected]="method() === 'phone'"
      [class.button--selected]="method() === 'phone'"
      class="button button--outline"
      (click)="method.set('phone')"
    >
      Téléphone
    </button>
    <button
      type="button"
      role="tab"
      id="auth-email-tab"
      aria-controls="auth-coming-soon"
      [attr.aria-selected]="method() === 'email'"
      [class.button--selected]="method() === 'email'"
      class="button button--outline"
      (click)="method.set('email')"
    >
      Email
    </button>
  </div>
  <p
    id="auth-coming-soon"
    class="auth-hint auth-coming-soon"
    role="tabpanel"
    [attr.aria-labelledby]="method() === 'phone' ? 'auth-phone-tab' : 'auth-email-tab'"
  >
    {{ method() === 'phone' ? 'Téléphone' : 'Email' }} · Bientôt disponible
  </p>
  <app-request-state [loading]="busy()" loadingLabel="Connexion en cours…" [error]="error()" />
}
