<header class="page-header">
  <a class="brand" routerLink="/" aria-label="WirdLink, accueil"
    ><img src="assets/brand/wirdlink-logo.svg" alt="" width="52" height="57" /><span
      >WirdLink</span
    ></a
  >
  <div class="page-header__actions">
    @if (auth.session(); as session) {
      <a
        class="account-link"
        routerLink="/profil"
        [attr.aria-label]="
          session.displayName ? 'Compte de ' + session.displayName : 'Votre compte'
        "
        title="Votre compte"
      >
        <app-user-avatar [name]="session.displayName ?? ''" />
      </a>
    }
    <a class="settings-link" routerLink="/preferences" aria-label="Réglages" title="Réglages"
      ><app-icon name="settings" [size]="24"
    /></a>
  </div>
</header>
<app-install-app />
<h1>Mes wirds</h1>
<app-wird-filters
  [(visibility)]="visibility"
  [resultCount]="visibleWirds().length"
  [(status)]="status"
  [(recurrence)]="recurrence"
/>
<p class="result-count" aria-live="polite">
  {{ visibleWirds().length }} {{ visibleWirds().length > 1 ? 'wirds' : 'wird' }}
</p>
@for (wird of visibleWirds(); track wird.id) {
  <app-wird-card
    [wird]="wird"
    [available]="store.available(wird.id)"
    [completed]="store.completed(wird.id)"
  />
} @empty {
  @if (store.wirds().length === 0) {
    <app-empty-state
      title="Aucun wird pour le moment"
      description="Créez votre premier wird pour commencer."
      actionLabel="Créer un wird"
      actionLink="/creer"
    />
  } @else {
    <app-empty-state
      title="Aucun wird ici"
      description="Essayez d’autres filtres pour retrouver un wird."
      actionLabel="Voir les wirds en cours"
      (actionRequested)="resetFilters()"
    />
  }
}
