<div class="filter-bar">
  <p class="filter-bar__count" aria-live="polite">
    {{ resultCount() }} {{ (resultCount() > 1 ? ('wirds en cours' | t) : ('wird en cours' | t)) | t }}
  </p>
  <button
    class="button button--outline button--compact"
    [attr.aria-expanded]="filterSheet.isOpen()"
    aria-controls="filters"
    (click)="filterSheet.open()"
  >
    <app-icon name="filter" [size]="24" />{{ 'Filtrer' | t }}
  </button>
</div>
<app-bottom-sheet #filterSheet panelId="filters" [title]="'Filtrer' | t">
  <div class="filter-sheet">
    <fieldset>
      <legend>{{ 'Quand' | t }}</legend>
      <div class="filter-sheet__choices filter-sheet__choices--recurrence">
        @for (option of recurrenceOptions; track option.value) {
          <button
            type="button"
            class="button button--outline button--compact"
            [value]="option.value"
            [class.button--selected]="recurrence() === option.value"
            [attr.aria-pressed]="recurrence() === option.value"
            (click)="recurrence.set(option.value)"
          >
            {{ option.label | t }}
          </button>
        }
      </div>
    </fieldset>
    <fieldset>
      <legend>{{ 'Qui peut voir' | t }}</legend>
      <div class="filter-sheet__choices segmented-choice">
        @for (option of visibilityOptions; track option.value) {
          <button
            type="button"
            class="button button--outline button--compact"
            [class.button--selected]="visibility() === option.value"
            [attr.aria-pressed]="visibility() === option.value"
            (click)="visibility.set(option.value)"
          >
            {{ option.label | t }}
          </button>
        }
      </div>
    </fieldset>
    <p class="text-secondary"></p>
    <button class="button button--primary" (click)="filterSheet.close()">
      {{ 'Voir les wirds' | t }} ({{ resultCount() }})
    </button>
    <button class="button button--outline" (click)="clearFilters()">
      {{ 'Tout effacer' | t }}
    </button>
  </div>
</app-bottom-sheet>
