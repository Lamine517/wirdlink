@for (item of methods; track item.id) {
  <button
    type="button"
    class="payment-method payment-method--{{ item.id }}"
    [disabled]="disabled()"
    (click)="select(item.id, paySheet)"
  >
    <img class="payment-method__logo" [src]="item.logo" alt="" width="40" height="40" />
    <span>{{ item.name }}</span>
    @if (!disabled() && amount()) {
      <strong>{{ amount() | number }} F</strong>
    }
  </button>
}

<app-bottom-sheet #paySheet [panelId]="panelId()" [title]="current().name">
  <div class="form-stack">
    <p class="payment-step">
      {{ 'Envoyez {amount} F CFA à ce numéro :' | t: { amount: format(amount()) } }}
    </p>
    <p class="payment-number">{{ number }}</p>
    <button type="button" class="button button--primary" (click)="copyNumber()">
      <app-icon [name]="copied() ? 'check' : 'copy'" [size]="22" />{{
        (copied() ? 'Numéro copié' : 'Copier le numéro') | t
      }}
    </button>
    @if (android && method() === 'orange') {
      <a class="button button--outline" href="tel:%23144%23"
        ><app-icon name="phone" [size]="22" />{{ 'Composer #144#' | t }}</a
      >
    }
    <p class="payment-hint">{{ current().hint | t }}</p>
    @if (note()) {
      <p class="payment-hint">{{ note() }}</p>
    }
  </div>
</app-bottom-sheet>
