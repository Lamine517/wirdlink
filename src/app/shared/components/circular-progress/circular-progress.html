<div
  class="progress-ring"
  role="progressbar"
  [attr.aria-label]="title() + ' : ' + ('Lectures terminées' | t)"
  aria-valuemin="0"
  [attr.aria-valuenow]="completed()"
  [attr.aria-valuemax]="target()"
  [style.--progress]="progress() + '%'"
>
  <div class="progress-ring__center">
    @if (showTitle()) {
      <span class="progress-ring__title">{{ title() }}</span>
    }
    <strong class="progress-ring__value">{{ completed() | number }}</strong>
    <span class="progress-ring__caption">{{ 'lus sur {target}' | t: { target: target() } }}</span>
  </div>
</div>
