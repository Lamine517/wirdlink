<div
  class="progress-ring"
  role="progressbar"
  [attr.aria-label]="title() + ' : lectures terminées'"
  aria-valuemin="0"
  [attr.aria-valuenow]="completed()"
  [attr.aria-valuemax]="target()"
  [style.--progress]="progress() + '%'"
>
  <div class="progress-ring__center">
    <span class="progress-ring__title">{{ title() }}</span>
    <strong class="progress-ring__value">{{ completed() | number }}</strong>
    <span class="progress-ring__caption">sur {{ target() | number }} lectures</span>
    <span class="progress-ring__badge">{{ progress() | number: '1.0-0' }} % terminé</span>
  </div>
</div>
