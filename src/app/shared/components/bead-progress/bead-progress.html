<div
  class="beads"
  role="progressbar"
  [attr.aria-label]="'Lectures terminées' | t"
  [attr.aria-valuenow]="completed()"
  [attr.aria-valuemax]="target()"
  aria-valuemin="0"
>
  @for (bead of beads; track bead) {
    <span
      class="beads__bead"
      [class.beads__bead--filled]="bead < filled()"
      aria-hidden="true"
    ></span>
  }
</div>
