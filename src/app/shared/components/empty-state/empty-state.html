<section class="empty-state">
  <div class="empty-state__icon">
    <span
      class="empty-state__glyph"
      [style.mask-image]="'url(' + icon() + ')'"
      aria-hidden="true"
    ></span>
  </div>
  <h2>{{ title() }}</h2>
  <p>{{ description() }}</p>
  @if (actionLabel()) {
    @if (actionLink(); as link) {
      <a class="button button--primary" [routerLink]="link">{{ actionLabel() }}</a>
    } @else {
      <button type="button" class="button button--primary" (click)="actionRequested.emit()">
        {{ actionLabel() }}
      </button>
    }
  }
</section>
